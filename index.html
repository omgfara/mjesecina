<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mjesečina</title>
<meta name="description" content="Mjesečina: praćenje menstrualnog ciklusa, faza, prognoze i simptoma na bosanskom jeziku.">
<meta name="theme-color" content="#150F20">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><clipPath id="dropclip"><path d="M12 2C12 2 3 12.5 3 19a9 9 0 0 0 18 0C21 12.5 12 2 12 2Z"/></clipPath></defs></svg>
<div class="sky" id="sky" data-phase="lut" aria-hidden="true"><div class="aur a1"></div><div class="aur a2"></div><div class="aur a3"></div><div class="moonlight"></div><canvas id="skyc"></canvas></div>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="-20 -20 40 40" aria-hidden="true"><circle r="16" style="fill:var(--moon-dark)"/><path id="brandLit" d="M0 -16A16 16 0 0 1 0 16A7 16 0 0 0 0 -16Z" style="fill:var(--moon-lit)"/><circle r="16" fill="none" style="stroke:var(--line)"/></svg>
      <div><div class="wm">Mjesečina</div><div class="tag">tvoj ciklus u ritmu mjeseca</div></div>
    </div>
    <button class="iconbtn" data-a="settings" aria-label="Postavke"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </header>
  <main id="view"></main>
  <p class="foot">Mjesečina je dnevnik i procjena, a ne medicinski savjet. Ako imaš jake bolove, neredovne cikluse ili sumnju na trudnoću, javi se ljekaru.</p>
</div>
<nav class="nav" aria-label="Glavna navigacija"><div class="nav-in">
  <button data-a="go" data-v="cycle"><svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>Ciklus</button>
  <button data-a="go" data-v="calendar"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Kalendar</button>
  <button class="navlog" data-a="go" data-v="log"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Bilježi</button>
  <button data-a="go" data-v="analysis"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Analiza</button>
</div></nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
